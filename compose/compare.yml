name: agent-tracer

# 두 구현체를 나란히 세워 같은 원장 위에서 견주는 배치다. 파드 이름이 축을 말하는 것은
# 견주는 것 자체가 목적이기 때문이며, 한 축만 올리는 배치는 중립 이름을 그대로 쓴다.
x-agent-env: &agent-env
  MONITOR_PROFILE: prd
  MONITOR_SETTINGS_ENCRYPTION_KEY: ${MONITOR_SETTINGS_ENCRYPTION_KEY:-monitor-dev-key}
  AGENT_DB_HOST: agent-db
  AGENT_DB_PORT: "5432"
  AGENT_DB_NAME: agent
  POSTGRES_USER: ${POSTGRES_USER:-root}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
  KAFKA_BROKERS: redpanda:29092
  TEMPORAL_ADDRESS: temporal:7233
  TRACER_API_URL: http://tracer-api:3902

x-agent-depends: &agent-depends
  agent-db: { condition: service_healthy }
  redpanda: { condition: service_healthy }
  temporal: { condition: service_started }
  temporal-namespace: { condition: service_completed_successfully }
  agent-schema: { condition: service_completed_successfully }

# 워크플로 ID 는 스레드 하나에 하나뿐이라 두 축이 같은 네임스페이스를 보면 뒤에 신호한 축이
# 상대 축의 워크플로에 연결된다. 네임스페이스가 축마다 달라 서로에게 도달하지 않는다.
# 큐 접두사도 축마다 달라 두 구현체가 서로 다른 큐를 본다.
x-ts-env: &ts-env
  <<: *agent-env
  NODE_ENV: production
  MONITOR_LISTEN_HOST: 0.0.0.0
  AGENT_TASK_QUEUE_PREFIX: ${COMPARE_TS_QUEUE_PREFIX:-agent-ts}
  TEMPORAL_NAMESPACE: ${COMPARE_TS_NAMESPACE:-agent-ts}
  AGENT_API_URL: http://agent-api-ts:3904

x-python-env: &python-env
  <<: *agent-env
  AGENT_TASK_QUEUE_PREFIX: ${COMPARE_PYTHON_QUEUE_PREFIX:-agent-python}
  TEMPORAL_NAMESPACE: ${COMPARE_PYTHON_NAMESPACE:-agent-python}
  AGENT_API_URL: http://agent-api-python:8800
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agent-tracer-local}
  LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}

x-ts-worker-depends: &ts-worker-depends
  <<: *agent-depends
  agent-api-ts: { condition: service_healthy }

x-python-worker-depends: &python-worker-depends
  <<: *agent-depends
  agent-api-python: { condition: service_healthy }

services:
  # 서버 이미지는 default 네임스페이스만 세우므로 축의 네임스페이스는 여기서 만든다.
  temporal-namespace:
    image: temporalio/admin-tools:1.25.2
    restart: "no"
    depends_on:
      temporal: { condition: service_started }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["sh", "-c"]
    command:
      - >-
        temporal operator namespace create --namespace ${COMPARE_TS_NAMESPACE:-agent-ts} || true;
        temporal operator namespace create --namespace ${COMPARE_PYTHON_NAMESPACE:-agent-python} || true

  # DDL 러너를 가진 구현체가 하나뿐이라 두 축이 같은 스키마를 그 이미지로 받는다.
  agent-schema:
    image: ${TRACER_AGENT_TS_IMAGE}
    command: ["sh", "-c", "cd services/agent-api && exec node --import @swc-node/register/esm-register src/agent.schema.ts"]
    environment: *ts-env
    restart: "no"
    depends_on:
      agent-db: { condition: service_healthy }

  agent-api-ts:
    image: ${TRACER_AGENT_TS_IMAGE}
    environment:
      <<: *ts-env
      AGENT_API_PORT: "3904"
    depends_on: *agent-depends
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3904/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 1s

  agent-chat-worker-ts:
    image: ${TRACER_AGENT_TS_IMAGE}
    command: ["sh", "-c", "cd services/agent-worker && exec node --import @swc-node/register/esm-register src/chat.main.ts"]
    environment: *ts-env
    depends_on: *ts-worker-depends

  agent-jobs-worker-ts:
    image: ${TRACER_AGENT_TS_IMAGE}
    command: ["sh", "-c", "cd services/agent-worker && exec node --import @swc-node/register/esm-register src/jobs.main.ts"]
    environment: *ts-env
    depends_on: *ts-worker-depends

  agent-generate-worker-ts:
    image: ${TRACER_AGENT_TS_IMAGE}
    command: ["sh", "-c", "cd services/agent-worker && exec node --import @swc-node/register/esm-register src/generate.main.ts"]
    environment: *ts-env
    depends_on: *ts-worker-depends

  agent-api-python:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    environment:
      <<: *python-env
      TRACER_AGENT_HOST: 0.0.0.0
      TRACER_AGENT_PORT: "8800"
    depends_on: *agent-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 1s

  agent-chat-worker-python:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    command: ["python", "-m", "tracer_agent.worker", "chat"]
    environment: *python-env
    depends_on: *python-worker-depends

  agent-jobs-worker-python:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    command: ["python", "-m", "tracer_agent.worker", "jobs"]
    environment: *python-env
    depends_on: *python-worker-depends

  agent-generate-worker-python:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    command: ["python", "-m", "tracer_agent.worker", "generate"]
    environment: *python-env
    depends_on: *python-worker-depends
