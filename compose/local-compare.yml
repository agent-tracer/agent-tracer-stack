name: agent-tracer

# compare 프로파일의 TypeScript 축만 사용자 구독 자격으로 실행하는 오버라이드다. Python 축과
# 추적과 게이트웨이는 그대로 두므로 상류 선택과 backend 누락 시의 거절이 바뀌지 않는다.
#
#   claude setup-token
#   export CLAUDE_CODE_OAUTH_TOKEN=<토큰>
#   node scripts/up.mjs --profile compare --local
services:
  agent-api-ts:
    environment:
      MONITOR_PROFILE: local

  agent-chat-worker-ts:
    environment:
      MONITOR_PROFILE: local
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token 이 낸 값을 CLAUDE_CODE_OAUTH_TOKEN 으로 넘긴다}

  agent-jobs-worker-ts:
    environment:
      MONITOR_PROFILE: local
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token 이 낸 값을 CLAUDE_CODE_OAUTH_TOKEN 으로 넘긴다}

  agent-generate-worker-ts:
    environment:
      MONITOR_PROFILE: local
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token 이 낸 값을 CLAUDE_CODE_OAUTH_TOKEN 으로 넘긴다}
