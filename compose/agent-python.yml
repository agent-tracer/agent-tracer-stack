name: agent-tracer

# 실행 원장은 아직 tracer-db 안에 살고 조회 모델 표와 데이터베이스를 나눠 갖는다.
x-agent-env: &agent-env
  MONITOR_PROFILE: prd
  # 저장된 모델 자격을 복호화하는 열쇠이며 추적 서비스와 같은 값이어야 한다.
  MONITOR_SETTINGS_ENCRYPTION_KEY: ${MONITOR_SETTINGS_ENCRYPTION_KEY:-monitor-dev-key}
  TRACER_DB_HOST: tracer-db
  TRACER_DB_PORT: "5432"
  TRACER_DB_NAME: tracer
  TRACER_DB_USER: ${POSTGRES_USER:-root}
  TRACER_DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
  KAFKA_BROKERS: redpanda:29092
  TEMPORAL_ADDRESS: temporal:7233
  # 큐의 완전한 이름을 이 접두사와 계약의 큐 키가 만들며, 두 축을 나란히 띄울 때만 값을 달리 준다.
  AGENT_TASK_QUEUE_PREFIX: ${AGENT_TASK_QUEUE_PREFIX:-agent}
  # 단가표도 한도도 자격도 이 서비스가 갖지 않으므로 시도마다 봉투를 여기서 받아 온다.
  TRACER_API_URL: http://tracer-api:3902
  # 워커가 배포 단위 안의 창구에서 프롬프트 조각의 판을 받는다.
  AGENT_API_URL: http://agent-api:8800
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agent-tracer-local}
  LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}

x-agent-depends: &agent-depends
  tracer-db: { condition: service_healthy }
  redpanda: { condition: service_healthy }
  temporal: { condition: service_started }
  migrate: { condition: service_completed_successfully }
  agent-schema: { condition: service_completed_successfully }

# 워커는 부팅에서 창구에 프롬프트 조각을 올리고 그 판을 받으므로 창구가 먼저 선다.
x-worker-depends: &worker-depends
  <<: *agent-depends
  agent-api: { condition: service_healthy }

services:
  # 계약이 선언한 에이전트 스키마를 적용하고 끝나는 원샷이며, DDL 러너를 가진 구현체가 하나뿐이라
  # 어느 축을 올리든 그 이미지를 쓴다.
  agent-schema:
    image: ${TRACER_AGENT_TS_IMAGE}
    command: ["sh", "-c", "cd services/agent-api && exec node --import @swc-node/register/esm-register src/agent.schema.ts"]
    environment:
      AGENT_DB_HOST: tracer-db
      AGENT_DB_PORT: "5432"
      AGENT_DB_NAME: tracer
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    restart: "no"
    depends_on:
      tracer-db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  agent-api:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    environment:
      <<: *agent-env
      TRACER_AGENT_HOST: 0.0.0.0
      TRACER_AGENT_PORT: "8800"
    depends_on: *agent-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 1s

  # 대화 실행의 재시도와 취소와 순서를 소유하며 chat 큐만 폴링한다.
  agent-chat-worker:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    command: ["python", "-m", "tracer_agent.worker", "chat"]
    environment: *agent-env
    depends_on: *worker-depends

  # 제목 제안과 레시피 스캔과 정리 제안의 워크플로를 돌며 jobs 큐만 폴링한다.
  agent-jobs-worker:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    command: ["python", "-m", "tracer_agent.worker", "jobs"]
    environment: *agent-env
    depends_on: *worker-depends

  # 긴 언어 모델 호출만 도는 파드이며 generate 큐만 폴링해 replica를 따로 늘린다.
  agent-generate-worker:
    image: ${TRACER_AGENT_PYTHON_IMAGE}
    command: ["python", "-m", "tracer_agent.worker", "generate"]
    environment: *agent-env
    depends_on: *worker-depends
