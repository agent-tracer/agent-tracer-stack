global:
  resolve_timeout: 5m

route:
  # alertname 은 언제나 있고 job 은 모든 scrape 대상이 갖는다. service 는 일부 규칙에만 붙어 묶음이 갈린다.
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers: ["severity=critical"]
      receiver: critical
      repeat_interval: 1h

receivers:
  # 주소는 배포가 얹는 파일이 갖는다. 저장소에 적으면 배포마다 다른 값을 담을 수 없다.
  - name: default
    webhook_configs:
      - url_file: /etc/alertmanager/webhook-url
        send_resolved: true

  - name: critical
    webhook_configs:
      - url_file: /etc/alertmanager/webhook-url-critical
        send_resolved: true

inhibit_rules:
  - source_matchers: ["alertname=ServiceDown"]
    target_matchers: ["severity=warning"]
    equal: ["job", "instance"]
