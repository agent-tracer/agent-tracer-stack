receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}
  # 알려진 비밀 및 원문 속성은 내부 Tempo pipeline을 건드리지 않고 LangSmith 전용 pipeline에서 denylist 방식으로 제거한다.
  attributes/langsmith_redact:
    actions:
      - { key: api_key, action: delete }
      - { key: apiKey, action: delete }
      - { key: authorization, action: delete }
      - { key: callback_token, action: delete }
      - { key: callbackToken, action: delete }
      - { key: scope_token, action: delete }
      - { key: scopeToken, action: delete }
      - { key: user.id, action: delete }
      - { key: enduser.id, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
      - { key: input.value, action: delete }
      - { key: output.value, action: delete }
  resource/langsmith_redact:
    attributes:
      - { key: api_key, action: delete }
      - { key: apiKey, action: delete }
      - { key: authorization, action: delete }
      - { key: callback_token, action: delete }
      - { key: callbackToken, action: delete }
      - { key: scope_token, action: delete }
      - { key: scopeToken, action: delete }
      - { key: user.id, action: delete }
      - { key: enduser.id, action: delete }

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  prometheus/app:
    endpoint: 0.0.0.0:9465
    translation_strategy: UnderscoreEscapingWithoutSuffixes
  otlphttp/langsmith:
    endpoint: ${env:LANGSMITH_OTLP_ENDPOINT}
    headers:
      x-api-key: ${env:LANGSMITH_API_KEY}
      Langsmith-Project: ${env:LANGSMITH_PROJECT}
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    timeout: 10s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/internal:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    traces/langsmith:
      receivers: [otlp]
      processors: [memory_limiter, attributes/langsmith_redact, resource/langsmith_redact, batch]
      exporters: [otlphttp/langsmith]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus/app]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
